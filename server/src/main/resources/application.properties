spring.application.name=NexaIoT Server

server.port=8081
provisioning.pairing.expiry-seconds=${PAIRING_SESSION_EXPIRY_SECONDS:600}
provisioning.pairing.maximum-attempts=${PAIRING_SESSION_MAX_ATTEMPTS:5}
mqtt.management.enabled=${MQTT_MANAGEMENT_ENABLED:false}
mqtt.management.broker-url=${MQTT_MANAGEMENT_BROKER_URL:tcp://127.0.0.1:1884}
mqtt.management.client-id=${MQTT_MANAGEMENT_CLIENT_ID:nexaiot-provisioning-management}
mqtt.management.username=${MQTT_MANAGEMENT_USERNAME:}
mqtt.management.password=${MQTT_MANAGEMENT_PASSWORD:}
mqtt.management.tls-required=${MQTT_MANAGEMENT_TLS_REQUIRED:true}
mqtt.management.timeout-seconds=${MQTT_MANAGEMENT_TIMEOUT_SECONDS:5}
mqtt.management.ca-certificate=${MQTT_MANAGEMENT_CA_CERTIFICATE:}

# Browser API policy. Use a comma-separated list in production.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.mongodb.uri=${MONGODB_URI}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Password reset mail configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:noreply@nexaiot.local}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset-expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:30}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# MQTT
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:nexaiot-server}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.auth-required=${MQTT_AUTH_REQUIRED:false}
mqtt.tls-required=${MQTT_TLS_REQUIRED:false}
mqtt.telemetry-topic=${MQTT_TELEMETRY_TOPIC:nexaiot/devices/+/telemetry}
mqtt.state-topic=${MQTT_STATE_TOPIC:nexaiot/devices/+/state}
mqtt.qos=${MQTT_QOS:1}

# Application abuse protection (in-memory, per server instance)
rate-limit.login.max=${RATE_LIMIT_LOGIN_MAX:8}
rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
rate-limit.register.max=${RATE_LIMIT_REGISTER_MAX:5}
rate-limit.register.window-seconds=${RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}
rate-limit.password-reset.max=${RATE_LIMIT_PASSWORD_RESET_MAX:5}
rate-limit.password-reset.window-seconds=${RATE_LIMIT_PASSWORD_RESET_WINDOW_SECONDS:900}
rate-limit.device-command.max=${RATE_LIMIT_DEVICE_COMMAND_MAX:30}
rate-limit.device-command.window-seconds=${RATE_LIMIT_DEVICE_COMMAND_WINDOW_SECONDS:60}
rate-limit.report.max=${RATE_LIMIT_REPORT_MAX:5}
rate-limit.report.window-seconds=${RATE_LIMIT_REPORT_WINDOW_SECONDS:300}
rate-limit.pairing-claim.max=${RATE_LIMIT_PAIRING_CLAIM_MAX:10}
rate-limit.pairing-claim.window-seconds=${RATE_LIMIT_PAIRING_CLAIM_WINDOW_SECONDS:60}

alerts.temperature-high-threshold=30.0
alerts.temperature-low-threshold=10.0
alerts.battery-low-threshold=20
alerts.humidity-high-threshold=70.0
alerts.humidity-low-threshold=40.0
alerts.rssi-weak-threshold=-70
alerts.device-offline-timeout-seconds=15
alerts.offline-check-interval-ms=5000

