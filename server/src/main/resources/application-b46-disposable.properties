server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${SERVER_SSL_KEY_STORE}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=server

spring.mongodb.uri=${MONGODB_URI}
nexaiot.b46.application-mode=${NEXAIOT_B46_APPLICATION_MODE:container}
nexaiot.b46.expected-mongo-host=${NEXAIOT_B46_EXPECTED_MONGO_HOST:mongo}
nexaiot.b46.expected-mongo-port=${NEXAIOT_B46_EXPECTED_MONGO_PORT:27017}
nexaiot.b46.expected-mqtt-host=${NEXAIOT_B46_EXPECTED_MQTT_HOST:mosquitto}
nexaiot.b46.expected-mqtt-port=${NEXAIOT_B46_EXPECTED_MQTT_PORT:8883}

mqtt.startup.enabled=true
mqtt.broker-url=${MQTT_BROKER_URL}
mqtt.client-id=${MQTT_CLIENT_ID}
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}
mqtt.auth-required=true
mqtt.tls-required=true
mqtt.ca-certificate=${MQTT_CA_CERTIFICATE}
mqtt.management.enabled=false

provisioning.credential-escrow.key=${NEXAIOT_CREDENTIAL_ESCROW_KEY}
provisioning.credential-escrow.key-version=${NEXAIOT_CREDENTIAL_ESCROW_KEY_VERSION}
provisioning.credential-escrow.expiry-seconds=3600

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
admin.bootstrap.enabled=false

spring.mail.host=mail-disabled.invalid
spring.mail.port=25
spring.mail.test-connection=false
alerts.offline-check-interval-ms=3600000
